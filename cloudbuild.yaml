substitutions:
  _REGION: asia-south1
  _REPO: containers
  _API: aurahrms-api
  _WEB: aurahrms-web
  _JOB: aurahrms-migrate
  _SQL_INSTANCE: aurahrms-pg
  _TAG: latest

steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.api
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_API:$_TAG
      - .

  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.web
      - --build-arg
      - VITE_API_URL=/api/v1
      - --build-arg
      - VITE_SOCKET_URL=/
      - --build-arg
      - VITE_APP_ENV=production
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_WEB:$_TAG
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_API:$_TAG

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_WEB:$_TAG

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SQL_CONN="$PROJECT_ID:$_REGION:$_SQL_INSTANCE"
        RUNTIME_SA="$PROJECT_NUMBER-compute@developer.gserviceaccount.com"
        gcloud run jobs deploy "$_JOB" \
          --project="$PROJECT_ID" \
          --image="$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_API:$_TAG" \
          --region="$_REGION" \
          --service-account="$RUNTIME_SA" \
          --set-cloudsql-instances="$SQL_CONN" \
          --set-secrets=DB_PASSWORD=aurahrms-db-password:latest \
          --set-env-vars="NODE_ENV=production,DB_HOST=/cloudsql/$SQL_CONN,DB_NAME=aurahrms,DB_USER=aurahrms_app,DB_SSL=false" \
          --command=npm \
          --args=run,migrate \
          --max-retries=0 \
          --task-timeout=900s
        gcloud run jobs execute "$_JOB" \
          --project="$PROJECT_ID" \
          --region="$_REGION" \
          --wait

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SQL_CONN="$PROJECT_ID:$_REGION:$_SQL_INSTANCE"
        RUNTIME_SA="$PROJECT_NUMBER-compute@developer.gserviceaccount.com"
        gcloud run deploy "$_API" \
          --project="$PROJECT_ID" \
          --image="$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_API:$_TAG" \
          --region="$_REGION" \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --cpu=1 \
          --memory=1Gi \
          --min-instances=0 \
          --max-instances=1 \
          --concurrency=250 \
          --session-affinity \
          --timeout=3600 \
          --service-account="$RUNTIME_SA" \
          --add-cloudsql-instances="$SQL_CONN" \
          --set-env-vars="NODE_ENV=production,DB_HOST=/cloudsql/$SQL_CONN,DB_NAME=aurahrms,DB_USER=aurahrms_app,DB_SSL=false,STORAGE_TYPE=gcs,GCS_BUCKET=$PROJECT_ID-documents,CORS_ORIGIN=https://aurahrms.com,LOG_LEVEL=info" \
          --set-secrets="DB_PASSWORD=aurahrms-db-password:latest,JWT_SECRET=aurahrms-jwt-secret:latest,SMTP_PASSWORD=aurahrms-smtp-password:latest"

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        RUNTIME_SA="$PROJECT_NUMBER-compute@developer.gserviceaccount.com"
        gcloud run deploy "$_WEB" \
          --project="$PROJECT_ID" \
          --image="$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_WEB:$_TAG" \
          --region="$_REGION" \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --cpu=1 \
          --memory=256Mi \
          --min-instances=0 \
          --max-instances=4 \
          --concurrency=200 \
          --service-account="$RUNTIME_SA"

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_API:$_TAG
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_WEB:$_TAG

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 2400s
