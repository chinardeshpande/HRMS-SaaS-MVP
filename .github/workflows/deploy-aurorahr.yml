name: Deploy to AuroraHR Production

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==================================
  # BUILD & TEST
  # ==================================
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Audit Backend Production Dependencies
        working-directory: ./backend
        run: npm audit --omit=dev --audit-level=high

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

      - name: Upload Backend Build
        uses: actions/upload-artifact@v7
        with:
          name: backend-build
          path: |
            backend/dist
            backend/scripts/production-smoke-test.js
            backend/templates
            backend/package.json
            backend/package-lock.json
          retention-days: 1

      - name: Install Frontend Dependencies
        working-directory: ./frontend-web
        run: yarn install --frozen-lockfile

      - name: Audit Frontend Production Dependencies
        working-directory: ./frontend-web
        run: yarn audit --groups dependencies --level high

      - name: Build Frontend
        working-directory: ./frontend-web
        env:
          VITE_API_URL: https://aurorahr.in/api/v1
          VITE_SOCKET_URL: https://aurorahr.in
          VITE_APP_NAME: AuroraHR
        run: yarn build

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend-web/dist
          retention-days: 1

  # ==================================
  # DEPLOY TO PRODUCTION
  # ==================================
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aurorahr.in

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Backend Build
        uses: actions/download-artifact@v7
        with:
          name: backend-build
          path: backend-build

      - name: Download Frontend Build
        uses: actions/download-artifact@v7
        with:
          name: frontend-build
          path: frontend-build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Create Deployment Archives
        run: |
          cd backend-build
          tar -czf ../backend-deploy.tar.gz .
          cd ..

          cd frontend-build
          tar -czf ../frontend-deploy.tar.gz .
          cd ..

      - name: Copy Deployment Archives
        run: |
          scp backend-deploy.tar.gz root@${{ secrets.PRODUCTION_SERVER_IP }}:/tmp/
          scp frontend-deploy.tar.gz root@${{ secrets.PRODUCTION_SERVER_IP }}:/tmp/

      - name: Deploy Backend And Frontend
        run: |
          ssh root@${{ secrets.PRODUCTION_SERVER_IP }} << 'ENDSSH'
            set -e

            # Backup current backend and frontend
            if [ -d /var/www/hrms-app/backend ]; then
              cp -r /var/www/hrms-app/backend /var/www/hrms-app/backend.backup.$(date +%Y%m%d_%H%M%S)
            fi
            if [ -d /var/www/hrms-app/frontend-web/dist ]; then
              cp -r /var/www/hrms-app/frontend-web/dist /var/www/hrms-app/frontend-web/dist.backup.$(date +%Y%m%d_%H%M%S)
            fi

            # Deploy backend
            mkdir -p /var/www/hrms-app/backend
            cd /var/www/hrms-app/backend
            find . -mindepth 1 -maxdepth 1 \
              ! -name '.env' \
              ! -name 'uploads' \
              ! -name 'logs' \
              ! -name 'node_modules' \
              -exec rm -rf {} +
            tar -xzf /tmp/backend-deploy.tar.gz
            npm ci --omit=dev

            # Backup production database immediately before migrations.
            # Migrations in this deploy path must be backward-compatible with the previous app version.
            set -a
            . ./.env
            set +a
            db_backup_dir=/var/backups/hrms
            db_backup_file="$db_backup_dir/hrms_pre_migration_$(date -u +%Y%m%dT%H%M%SZ).dump"
            mkdir -p "$db_backup_dir"
            if command -v docker >/dev/null 2>&1; then
              docker run --rm --network host \
                -e PGPASSWORD="$DB_PASSWORD" \
                -v "$db_backup_dir:/backup" \
                postgres:15 \
                pg_dump \
                  -h "${DB_HOST:-localhost}" \
                  -p "${DB_PORT:-5432}" \
                  -U "${DB_USER:-postgres}" \
                  -d "${DB_NAME:-hrms_prod}" \
                  -Fc \
                  -f "/backup/$(basename "$db_backup_file")"
            else
              PGPASSWORD="$DB_PASSWORD" pg_dump \
                -h "${DB_HOST:-localhost}" \
                -p "${DB_PORT:-5432}" \
                -U "${DB_USER:-postgres}" \
                -d "${DB_NAME:-hrms_prod}" \
                -Fc \
                -f "$db_backup_file"
            fi
            test -s "$db_backup_file"
            echo "Created production database backup: $db_backup_file"

            npm run migrate
            pm2 restart aurorahr-backend || pm2 start npm --name aurorahr-backend -- start

            # Deploy frontend
            mkdir -p /var/www/hrms-app/frontend-web/dist
            cd /var/www/hrms-app/frontend-web/dist
            rm -rf ./*
            tar -xzf /tmp/frontend-deploy.tar.gz

            # Cleanup old backups (keep last 3)
            cd /var/www/hrms-app
            ls -dt backend.backup.* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true
            cd /var/www/hrms-app/frontend-web
            ls -dt dist.backup.* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true

            # Cleanup
            rm /tmp/backend-deploy.tar.gz
            rm /tmp/frontend-deploy.tar.gz
          ENDSSH

      - name: Health Check
        run: |
          sleep 10

          # Check backend
          backend_response=$(curl -s -o /dev/null -w "%{http_code}" https://aurorahr.in/health)
          if [ $backend_response -ne 200 ]; then
            echo "Backend health check failed with status $backend_response"
            exit 1
          fi

          # Check frontend
          frontend_response=$(curl -s -o /dev/null -w "%{http_code}" https://aurorahr.in/)
          if [ $frontend_response -ne 200 ]; then
            echo "Frontend health check failed with status $frontend_response"
            exit 1
          fi

          echo "✅ Backend and frontend deployed successfully!"

      - name: Authenticated API Smoke Test
        run: |
          ssh root@${{ secrets.PRODUCTION_SERVER_IP }} << 'ENDSSH'
            set -e
            cd /var/www/hrms-app/backend
            SMOKE_TEST_BASE_URL=http://localhost:3000/api/v1 node scripts/production-smoke-test.js
          ENDSSH

      - name: Frontend Smoke Test
        run: |
          FRONTEND_SMOKE_BASE_URL=https://aurorahr.in node frontend-web/scripts/production-frontend-smoke-test.js

      - name: Cleanup Old Backups
        if: success()
        run: |
          ssh root@${{ secrets.PRODUCTION_SERVER_IP }} << 'ENDSSH'
            # Keep only last 3 app backups and last 10 pre-migration database backups
            cd /var/www/hrms-app
            ls -dt backend.backup.* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true
            find /var/backups/hrms -maxdepth 1 -name 'hrms_pre_migration_*.dump' -type f -printf '%T@ %p\n' 2>/dev/null | sort -rn | tail -n +11 | cut -d' ' -f2- | xargs rm -f 2>/dev/null || true
            cd /var/www/hrms-app/frontend-web
            ls -dt dist.backup.* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true
          ENDSSH

  # ==================================
  # ROLLBACK ON FAILURE
  # ==================================
  rollback:
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Rollback to Previous Version
        run: |
          ssh root@${{ secrets.PRODUCTION_SERVER_IP }} << 'ENDSSH'
            set -e

            cd /var/www/hrms-app
            latest_backend=$(ls -dt backend.backup.* 2>/dev/null | head -1)
            if [ ! -z "$latest_backend" ]; then
              rm -rf backend
              cp -r "$latest_backend" backend
              cd /var/www/hrms-app/backend
              npm ci --omit=dev
              pm2 restart aurorahr-backend || pm2 start npm --name aurorahr-backend -- start
              echo "⚠️ Backend rollback completed"
            else
              echo "⚠️ No backend backup found to rollback to"
            fi

            cd /var/www/hrms-app/frontend-web
            latest_frontend=$(ls -dt dist.backup.* 2>/dev/null | head -1)
            if [ ! -z "$latest_frontend" ]; then
              rm -rf dist
              cp -r "$latest_frontend" dist
              echo "⚠️ Frontend rollback completed"
            else
              echo "⚠️ No backup found to rollback to"
            fi
          ENDSSH

      - name: Notify Rollback
        if: always()
        run: |
          echo "⚠️ Deployment failed and was rolled back"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
