name: E2E Tests (Playwright)

on:
  pull_request:
    paths:
      - 'e2e/**'
      - 'frontend-web/**'
      - 'backend/**'
      - '.github/workflows/e2e-tests.yml'
  push:
    branches:
      - main
      - 'claude/**'
      - 'codex/**'
    paths:
      - 'e2e/**'
      - 'frontend-web/**'
      - 'backend/**'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hrms_saas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: hrms_saas_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: aurorahr-ci-e2e-test-secret
      JWT_EXPIRY: 1h
      JWT_REFRESH_EXPIRY: 2h
      ENABLE_SWAGGER: 'false'
      LOG_LEVEL: error
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Backend setup ---
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Seed E2E test database
        working-directory: backend
        run: npx ts-node scripts/seed-e2e-db.ts

      - name: Start backend server
        working-directory: backend
        run: |
          npx ts-node src/server.ts &
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
          curl -sf http://localhost:3000/health || (echo "Backend failed to start" && exit 1)

      # --- Frontend setup ---
      - name: Install frontend dependencies
        working-directory: frontend-web
        run: npm install --no-audit --no-fund

      - name: Start frontend dev server
        working-directory: frontend-web
        run: |
          npx vite --host 0.0.0.0 --port 5173 &
          echo "Waiting for frontend to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
          curl -sf http://localhost:5173 || (echo "Frontend failed to start" && exit 1)

      # --- Playwright setup ---
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      # --- Run E2E tests ---
      - name: Run Playwright E2E tests
        working-directory: e2e
        run: npx playwright test --reporter=list,json
        env:
          CI: 'true'
          FRONTEND_URL: http://localhost:5173

      # --- Artifacts on failure ---
      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: |
            e2e/test-results/
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            e2e/test-results/results.json
          retention-days: 14
